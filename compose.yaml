services:

  database:
    image: mysql:8.4
    command: --lower-case-table-names=1

    environment:
      MYSQL_ROOT_PASSWORD: clapino
      MYSQL_DATABASE: ciclismo

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/ciclismo.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pclapino"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: clapino
      DB_NAME: ciclismo

    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      
    env_file:
      - ./frontend/.env

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mysql_data: