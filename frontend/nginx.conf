server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de las peticiones (consultas SQL, preguntas al asistente)
    client_max_body_size 2m;

    # ------------------------------------------------------------------
    # API: se elimina el prefijo /clapino/api y se reenvía al backend.
    #   /clapino/api/auth/me  ->  http://backend:5000/auth/me
    # ------------------------------------------------------------------
    location /clapino/api/ {
        proxy_pass http://backend:5000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El asistente (LLM) puede tardar en responder
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Frontend (SPA de React): cualquier ruta desconocida bajo /clapino/
    # devuelve index.html para que el enrutado lo haga el navegador.
    # ------------------------------------------------------------------
    location /clapino/ {
        try_files $uri $uri/ /clapino/index.html;
    }

    # Redirecciones de cortesía
    location = /clapino { return 301 /clapino/; }
    location = /        { return 301 /clapino/; }
}
